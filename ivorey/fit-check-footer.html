<!-- REVI Fit Check survey: Footer HTML
     Lives in Ivorey > Sites > Surveys > Fit Check > Styles & Options > Advanced > Footer HTML.
     Ivorey nests everything in the Custom CSS box inside #_builder-form, which breaks @import
     and misses the popup, so the font import, the popup styles and the footer buttons live here.
     The rest of the styling is in fit-check-survey.css (Custom CSS box). To undo, clear both boxes and save. -->
<style>@import url("https://fonts.bunny.net/css?family=lato:400,700,900|lora:400i,600");.submission-dialog-overlay{background:rgba(246,246,246,0.88) !important;-webkit-backdrop-filter:blur(2px) !important;backdrop-filter:blur(2px) !important;align-items:flex-start !important;padding-top:96px !important;box-sizing:border-box}.submission-dialog-popup{border:1px solid #e9e9e9 !important;border-radius:12px !important;box-shadow:0 12px 32px rgba(61,60,61,0.16) !important;padding:20px !important;font-family:"Lato","Helvetica Neue",Arial,sans-serif !important}.submission-dialog-popup *{font-family:"Lato","Helvetica Neue",Arial,sans-serif !important}.continue-button{background:#871aae !important;color:#ffffff !important;border-color:#871aae !important}.start-over-button{color:#5b5a5b !important}</style><style>.ghl-footer-back,.ghl-btn-placeholder{background:#f3e8f7 !important;color:#651482 !important}.ghl-footer-back *,.ghl-footer-back-arrow{color:#651482 !important;fill:#651482 !important}.ghl-footer-back svg path{stroke:#651482 !important}.ghl-submit-btn{background:#871aae !important;color:#ffffff !important;font-family:"Lato","Helvetica Neue",Arial,sans-serif !important}.ghl-submit-btn:hover{background:#651482 !important}</style>
